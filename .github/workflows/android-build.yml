name: Build Android APK & AAB

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "**.pdf"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest me Android SDK pehle se installed hai. setup-android action 'tools' package
      # dhoondh ke fail ho raha tha, isliye sirf licenses accept karte hain.
      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Repo me gradlew / gradle-wrapper.jar nahi hai, isliye Gradle 9.3.1 direct install.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create .env (Gemini API key)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          else
            echo "::warning::GEMINI_API_KEY secret not set - placeholder key use hoga."
            cp .env.example .env
          fi

      - name: Prepare keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD_SECRET" ] && [ -n "$KEY_PASSWORD_SECRET" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            echo "::warning::Release keystore secrets nahi hain - temporary CI keystore use hoga."
            TMP_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$TMP_PASS"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
              -storepass "$TMP_PASS" -alias upload -keypass "$TMP_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Smart Calculator CI,O=CodeCrafix,C=IN"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$TMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$TMP_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK, release APK and release AAB
        run: gradle assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/SmartCalculator-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/SmartCalculator-release.apk
          cp app/build/outputs/bundle/release/*.aab dist/SmartCalculator-release.aab
          ls -lh dist

      - name: Upload APK + AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-calculator-apk-aab
          path: dist/*
          if-no-files-found: error

      # Direct download (bina zip ke): repo ke Releases section me APK + AAB attach hoti hai.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Smart Calculator build #${{ github.run_number }}
          body: "Auto build from commit ${{ github.sha }}"
          files: dist/*
