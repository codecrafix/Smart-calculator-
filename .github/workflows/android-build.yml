name: Build Android APK & AAB

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "**.pdf"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK (accepts licenses)
        uses: android-actions/setup-android@v3

      # Repo me gradlew / gradle-wrapper.jar nahi hai, isliye Gradle 9.3.1 direct install.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create .env (Gemini API key)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          else
            echo "::warning::GEMINI_API_KEY secret not set - placeholder key use hoga."
            cp .env.example .env
          fi

      - name: Prepare keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD_SECRET" ] && [ -n "$KEY_PASSWORD_SECRET" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            echo "::warning::Release keystore secrets nahi hain - temporary CI keystore use hoga."
            TMP_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$TMP_PASS"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
              -storepass "$TMP_PASS" -alias upload -keypass "$TMP_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Smart Calculator CI,O=CodeCrafix,C=IN"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$TMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$TMP_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK, release APK and release AAB
        run: gradle assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-calculator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-calculator-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: smart-calculator-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          
